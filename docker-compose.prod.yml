services:
  roadassist-server:
    image: ghcr.io/tritruong666/roadassist-server:latest
    container_name: roadassist-server
    restart: always
    env_file:
      - .env.production
    ports:
      - "9898:9898"
    environment:
      - NODE_ENV=production
      - TZ=Asia/Ho_Chi_Minh
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - roadassist-network

  valhalla:
    extends:
      file: docker-compose.routing.yml
      service: valhalla
    profiles: [routing]
    networks:
      - roadassist-network

volumes:
  roadassist_valhalla_data:

networks:
  roadassist-network:
    external: true
